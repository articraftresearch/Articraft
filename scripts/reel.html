<!doctype html>
<!--
  Offscreen frame capture for the README reel.

  This renders with the same recipe as the live viewer: USDZ through USDLoader,
  authored PBR appearances, image based lighting, ACES tone mapping. It spins
  each object one full turn, posting every frame back to the reel script.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>reel capture</title>
<style>body { margin:0; background:#f7f8fa; } canvas { display:block; }</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { USDLoader } from "three/addons/loaders/USDLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const config = await (await fetch("/bootstrap.json")).json();
const { size, frames, elevation, zoom, background, supersample } = config;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(supersample);
renderer.setSize(size, size, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.append(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(background);
const camera = new THREE.PerspectiveCamera(34, 1, 0.001, 1000);
camera.up.set(0, 0, 1);

// Studio three point rig. The environment does the soft filling, so the lights
// only have to shape: a key for form, a fill to open the shadows, a rim to lift
// the silhouette off the background.
const key = new THREE.DirectionalLight(0xffffff, 1.85);
key.castShadow = true;
key.shadow.mapSize.set(4096, 4096);
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
key.shadow.radius = 5;  // soft edge: a razor sharp shadow reads as a paste up
const fill = new THREE.DirectionalLight(0xdfe7f2, 0.38);
const rim = new THREE.DirectionalLight(0xffffff, 1.05);
scene.add(key, key.target, fill, fill.target, rim, rim.target);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.78;

// A ground plane that takes shadow but not color, so panels sit on the page.
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(500, 500),
  new THREE.ShadowMaterial({ opacity: 0.11 }),
);
ground.receiveShadow = true;
scene.add(ground);

const materialsOf = (mesh) => (Array.isArray(mesh.material) ? mesh.material : [mesh.material]);

// Both helpers below mirror the live viewer, so the reel and the viewer agree.
function applyMaterials(meshes, shapes) {
  const specs = (shapes || []).filter((shape) => shape.appearance);
  if (!specs.length) return;
  const byName = new Map(specs.map((shape) => [shape.usd_name, shape.appearance]));
  const only = specs.length === 1 ? specs[0].appearance : null;
  for (const mesh of meshes) {
    const spec = byName.get(mesh.name) ?? only;
    if (!spec) continue;
    for (const target of materialsOf(mesh)) {
      const [r, g, b] = spec.base_color;
      if (target.color) target.color.setRGB(r, g, b, THREE.SRGBColorSpace);
      if ("metalness" in target) target.metalness = spec.metallic;
      if ("roughness" in target) target.roughness = spec.roughness;
      if (target.emissive && spec.emissive) target.emissive.setRGB(...spec.emissive, THREE.SRGBColorSpace);
      const opacity = spec.opacity ?? 1;
      if (opacity < 1) { target.transparent = true; target.opacity = opacity; target.depthWrite = false; }
      target.needsUpdate = true;
    }
  }
}

function robot(usd, model) {
  const scope = usd.getObjectByName("parts");
  if (!scope) throw new Error("USDZ has no parts");
  const root = new THREE.Group();
  const parts = new Map();
  const joints = new Map();
  for (const spec of model.parts) {
    const node = scope.children.find((child) => child.name === spec.usd_name);
    if (!node) throw new Error(`Missing part ${spec.name}`);
    node.removeFromParent();
    node.position.set(0, 0, 0);
    node.quaternion.identity();
    node.scale.set(1, 1, 1);
    const meshes = [];
    node.traverse((child) => { if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; meshes.push(child); } });
    applyMaterials(meshes, spec.shapes);
    parts.set(spec.name, node);
  }
  const children = new Set();
  for (const spec of model.articulations) {
    const parent = parts.get(spec.parent);
    const child = parts.get(spec.child);
    if (!parent || !child) continue;
    const frame = new THREE.Group();
    const motion = new THREE.Group();
    frame.position.fromArray(spec.origin.xyz);
    // The SDK builds origin.rpy as an extrinsic sxyz matrix (Rz·Ry·Rx), which is
    // three.js order "ZYX". Using "XYZ" only agrees when one component is
    // nonzero, so multi axis frames — a tripod leg yawed 120 degrees — get a
    // hinge axis that is tilted out of plane and the whole object tips.
    frame.rotation.set(...spec.origin.rpy, "ZYX");
    frame.add(motion);
    motion.add(child);
    parent.add(frame);
    joints.set(spec.name, { spec, node: motion });
    children.add(spec.child);
  }
  for (const spec of model.parts) if (!children.has(spec.name)) root.add(parts.get(spec.name));
  return { root, joints };
}

function pose(joints, values) {
  for (const [name, joint] of joints) {
    const value = values[name] ?? 0;
    const axis = new THREE.Vector3().fromArray(joint.spec.axis).normalize();
    joint.node.position.set(0, 0, 0);
    joint.node.quaternion.identity();
    if (joint.spec.type === "prismatic") joint.node.position.copy(axis.multiplyScalar(value));
    else joint.node.quaternion.setFromAxisAngle(axis, value);
  }
}

async function post(path, body) {
  await fetch(path, { method: "POST", body });
}

for (const [index, panel] of config.panels.entries()) {
  const usd = await new USDLoader().loadAsync(`/models/${encodeURIComponent(panel.id)}.usdz`);
  const { root, joints } = robot(usd, panel.model);
  scene.add(root);

  // One camera distance for every pose and angle, so the object holds its size
  // as it turns. Fitting the projected corners rather than a bounding sphere
  // keeps thin objects — a tripod, a gripper — from swimming in empty frame.
  const box = new THREE.Box3();
  const center = new THREE.Vector3();
  const cages = [];
  let floor = Infinity;
  for (const values of panel.poses) {
    pose(joints, values);
    root.updateMatrixWorld(true);
    const bounds = new THREE.Box3().setFromObject(root);
    box.union(bounds);
    floor = Math.min(floor, bounds.min.z);
    cages.push(bounds);
  }
  box.getCenter(center);
  ground.position.z = floor;

  const corners = [];
  for (const bounds of cages) {
    for (const x of [bounds.min.x, bounds.max.x])
      for (const y of [bounds.min.y, bounds.max.y])
        for (const z of [bounds.min.z, bounds.max.z])
          corners.push(new THREE.Vector3(x, y, z).sub(center));
  }
  // Scale the rig to the object. These run from a 0.2 m gripper to a 5 m
  // excavator arm, so a rig fixed in world space would light one and miss the
  // other, and a fixed shadow camera would waste its whole map on empty ground.
  const reach = Math.max(
    box.max.x - box.min.x,
    box.max.y - box.min.y,
    box.max.z - box.min.z,
  );
  const place = (light, offset) => {
    light.target.position.copy(center);
    light.position.copy(center).add(offset.multiplyScalar(reach));
    light.target.updateMatrixWorld();
  };
  place(key, new THREE.Vector3(0.6, -1.0, 1.5));
  place(fill, new THREE.Vector3(-1.4, -0.7, 0.5));
  place(rim, new THREE.Vector3(-0.5, 1.5, 0.9));
  const shade = reach * 0.85;
  Object.assign(key.shadow.camera, {
    left: -shade,
    right: shade,
    top: shade,
    bottom: -shade,
    near: reach * 0.05,
    far: reach * 6,
  });
  key.shadow.camera.updateProjectionMatrix();

  const halfFov = THREE.MathUtils.degToRad(camera.fov / 2);
  let distance = 0;
  for (let frame = 0; frame < frames; frame++) {
    const angle = (2 * Math.PI * frame) / frames;
    const forward = new THREE.Vector3(Math.cos(angle), Math.sin(angle), elevation).normalize();
    const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 0, 1)).normalize();
    const up = new THREE.Vector3().crossVectors(right, forward).normalize();
    for (const corner of corners) {
      // Perspective: a corner fits when its lateral offset clears the frustum
      // at its own depth, so each one implies a minimum camera distance.
      const depth = corner.dot(forward);
      const lateral = Math.max(Math.abs(corner.dot(right)), Math.abs(corner.dot(up)));
      distance = Math.max(distance, lateral / Math.tan(halfFov) + depth);
    }
  }
  distance *= zoom;
  for (let frame = 0; frame < frames; frame++) {
    const angle = (2 * Math.PI * frame) / frames;
    pose(joints, panel.poses[frame]);
    root.updateMatrixWorld(true);
    camera.position.set(
      center.x + distance * Math.cos(angle),
      center.y + distance * Math.sin(angle),
      center.z + distance * elevation,
    );
    camera.lookAt(center);
    camera.updateProjectionMatrix();
    renderer.render(scene, camera);
    const blob = await new Promise((resolve) => renderer.domElement.toBlob(resolve, "image/png"));
    await post(`/frame/${index}/${frame}`, blob);
  }
  scene.remove(root);
}
await post("/done", "");
</script>
</body>
</html>
