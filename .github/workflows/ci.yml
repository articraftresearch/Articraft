name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.17"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --group dev --group sim --frozen

      - name: Check repository hygiene
        run: uv run --frozen python scripts/check_repo_hygiene.py

      - name: Check formatting
        run: uv run --frozen ruff format --check src/articraft tests

      - name: Lint
        run: uv run --frozen ruff check src/articraft tests

      - name: Type check
        run: uv run --frozen basedpyright

      - name: Test
        run: uv run --frozen pytest -q -m 'not live and not volume'

  dist:
    name: dist (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.17"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build sdist and wheel
        run: uv build --no-sources

      - name: Check distributions
        run: uvx twine check dist/*

      - name: Smoke-test the wheel in a clean environment
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/articraft --help >/dev/null
          code=0
          /tmp/smoke/bin/python -m articraft.compiler.worker >/dev/null 2>&1 || code=$?
          test "$code" -eq 2
          /tmp/smoke/bin/python -c "
          import articraft
          from articraft import package_dir
          from articraft.sdk import RigidBodyAssembly, TestContext
          assert (package_dir / 'prompts' / 'system.md').is_file()
          assert (package_dir / 'viewer.html').is_file()
          assert (package_dir / 'sdk' / 'docs' / 'common' / '00_quickstart.md').is_file()
          "
          mkdir -p /tmp/sdk-smoke
          cp examples/hinged_box/main.py /tmp/sdk-smoke/main.py
          /tmp/smoke/bin/python -c "
          import sys
          from pathlib import Path
          sys.path.insert(0, '/tmp/sdk-smoke')
          from main import object_model, run_tests
          from articraft.sdk.export import export_assembly
          object_model.validate()
          assert run_tests().passed
          result = export_assembly(object_model, Path('/tmp/sdk-smoke/output'))
          assert result.manifest.is_file()
          assert result.usdz.is_file()
          "
          /tmp/smoke/bin/python -c "
          import shutil
          from pathlib import Path
          from articraft.agent.workspace import LocalWorkspace
          env = LocalWorkspace(output_dir=Path('/tmp'))
          run_dir = env.create_run('smoke-run')
          shutil.copyfile('examples/mesh_knob/main.py', run_dir / 'workspace' / 'main.py')
          payload = env.compile_path(run_dir)
          assert payload['status'] == 'success', payload
          "
